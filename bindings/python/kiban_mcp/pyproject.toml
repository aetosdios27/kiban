[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiban-mcp"
version = "0.2.0"
description = "Stdio MCP agent memory backed by Kiban"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["kiban==0.2.0", "mcp>=1.28,<2"]

[project.scripts]
kiban-mcp = "kiban_mcp.__main__:main"

[tool.setuptools]
packages = ["kiban_mcp"]
package-dir = { "kiban_mcp" = "." }
