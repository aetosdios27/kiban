name: Nightly deep verification

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  torture-long:
    name: Long crash-recovery torture (seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: >
          cargo run --locked --release --example torture --
          --mode process --cycles 20000 --operations 200 --keys 500 --threads 8
          --snapshots true --seed ${{ matrix.seed }}
          --db "$RUNNER_TEMP/kiban-torture-db"
          --output "$RUNNER_TEMP/kiban-torture-results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: torture-long-seed-${{ matrix.seed }}
          path: ${{ runner.temp }}/kiban-torture-results
          if-no-files-found: ignore

  stress-repeat:
    name: Repeated release stress tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Scheduling-dependent failures surface by repetition, not by one run.
      - run: |
          for i in $(seq 1 20); do
            echo "::group::iteration $i"
            cargo test --locked --release --lib -- --ignored --nocapture
            echo "::endgroup::"
          done
